<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="router-title router-desc" role="img" viewBox="0 0 1200 760"><title id="router-title">Choose a lesson visualization by its learning job</title><desc id="router-desc">A decision map routes a learner&apos;s need to structure, quantity, interaction, change over time, or appearance. Every route ends in an editable source, rendered inspection, revision, accessibility, provenance, and a static fallback.</desc><defs><linearGradient id="header-gradient" x1="0" x2="1"><stop offset="0" stop-color="#172554"/><stop offset="1" stop-color="#312e81"/></linearGradient><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#475569" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.title{font:700 32px system-ui,sans-serif;fill:#fff}.subtitle{font:400 17px system-ui,sans-serif;fill:#dbeafe}.node-title,.question{fill:#0f172a}.question{font:700 22px system-ui,sans-serif}.node-title{font:700 18px system-ui,sans-serif}.node-copy{font:400 14px system-ui,sans-serif;fill:#334155}.tool{font:600 13px system-ui,sans-serif;fill:#3730a3}.footer-title{font:700 18px system-ui,sans-serif;fill:#fff}.footer-copy{font:400 14px system-ui,sans-serif;fill:#e0e7ff}.connector{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}</style></defs><rect width="1200" height="760" fill="#f8fafc" rx="28"/><path fill="url(#header-gradient)" d="M28 0 H1172 Q1200 0 1200 28 V132 H0 V28 Q0 0 28 0Z"/><text x="58" y="58" class="title">Choose the visual by the learning job</text><text x="58" y="92" class="subtitle">Use the simplest medium that exposes the relationship accurately. Motion is a dimension, not decoration.</text><rect width="410" height="78" x="395" y="162" fill="#fff" stroke="#cbd5e1" rx="20"/><text x="600" y="197" class="question" text-anchor="middle">What must the learner perceive?</text><text x="600" y="221" class="node-copy" text-anchor="middle">Structure, quantity, interaction, change, or appearance?</text><path d="M480 240 C360 270 260 270 160 315" class="connector"/><path d="M540 240 C480 270 420 280 380 315" class="connector"/><path d="M600 240 V315" class="connector"/><path d="M660 240 C720 270 780 280 820 315" class="connector"/><path d="M720 240 C840 270 940 270 1040 315" class="connector"/><g id="route-structure"><rect width="210" height="230" x="55" y="315" fill="#eff6ff" stroke="#60a5fa" rx="20"/><circle cx="160" cy="357" r="25" fill="#dbeafe"/><path stroke="#1d4ed8" stroke-linecap="round" stroke-width="4" d="M146 357h28M160 343v28"/><text x="160" y="405" class="node-title" text-anchor="middle">Structure</text><text x="160" y="433" class="node-copy" text-anchor="middle">Exact labels, flows,</text><text x="160" y="453" class="node-copy" text-anchor="middle">hierarchy, geometry</text><text x="160" y="492" class="tool" text-anchor="middle">SVG · Mermaid · D2</text><text x="160" y="514" class="tool" text-anchor="middle">Graphviz · draw.io</text></g><g id="route-quantity"><rect width="210" height="230" x="275" y="315" fill="#f0fdf4" stroke="#4ade80" rx="20"/><circle cx="380" cy="357" r="25" fill="#dcfce7"/><path stroke="#15803d" stroke-linecap="round" stroke-width="5" d="M365 370v-16M377 370v-30M389 370v-23M401 370v-39"/><text x="380" y="405" class="node-title" text-anchor="middle">Quantity</text><text x="380" y="433" class="node-copy" text-anchor="middle">Comparison, trend,</text><text x="380" y="453" class="node-copy" text-anchor="middle">distribution, uncertainty</text><text x="380" y="492" class="tool" text-anchor="middle">Vega-Lite · Plot</text><text x="380" y="514" class="tool" text-anchor="middle">ECharts · domain plots</text></g><g id="route-interaction"><rect width="210" height="230" x="495" y="315" fill="#fff7ed" stroke="#fb923c" rx="20"/><circle cx="600" cy="357" r="25" fill="#ffedd5"/><path fill="none" stroke="#c2410c" stroke-linecap="round" stroke-width="3" d="M587 345h26v24h-26zM592 351h16M592 357h10"/><text x="600" y="405" class="node-title" text-anchor="middle">Interaction</text><text x="600" y="433" class="node-copy" text-anchor="middle">Change, test, inspect,</text><text x="600" y="453" class="node-copy" text-anchor="middle">filter, connect, predict</text><text x="600" y="492" class="tool" text-anchor="middle">HTML/SVG/JS · React Flow</text><text x="600" y="514" class="tool" text-anchor="middle">Canvas · WebGL</text></g><g id="route-change"><rect width="210" height="230" x="715" y="315" fill="#faf5ff" stroke="#c084fc" rx="20"/><circle cx="820" cy="357" r="25" fill="#f3e8ff"/><path fill="#7e22ce" d="M808 343l20 14-20 14z"/><text x="820" y="405" class="node-title" text-anchor="middle">Change over time</text><text x="820" y="433" class="node-copy" text-anchor="middle">Causality, transformation,</text><text x="820" y="453" class="node-copy" text-anchor="middle">sequence, synchronization</text><text x="820" y="492" class="tool" text-anchor="middle">Manim 0.21 · HyperFrames</text><text x="820" y="514" class="tool" text-anchor="middle">interactive first · film projection</text></g><g id="route-appearance"><rect width="210" height="230" x="935" y="315" fill="#fff1f2" stroke="#fb7185" rx="20"/><circle cx="1040" cy="357" r="25" fill="#ffe4e6"/><path fill="none" stroke="#be123c" stroke-linejoin="round" stroke-width="3" d="M1026 370l9-13 8 8 9-14 12 19z"/><circle cx="1031" cy="348" r="4" fill="#be123c"/><text x="1040" y="405" class="node-title" text-anchor="middle">Appearance</text><text x="1040" y="433" class="node-copy" text-anchor="middle">Scene, object, atmosphere,</text><text x="1040" y="453" class="node-copy" text-anchor="middle">visual metaphor</text><text x="1040" y="492" class="tool" text-anchor="middle">Image generation</text><text x="1040" y="514" class="tool" text-anchor="middle">Sourced photography</text></g><path d="M160 545 C160 590 300 590 370 618" class="connector"/><path d="M380 545 C380 580 450 588 500 618" class="connector"/><path d="M600 545 V618" class="connector"/><path d="M820 545 C820 580 750 588 700 618" class="connector"/><path d="M1040 545 C1040 590 900 590 830 618" class="connector"/><rect width="820" height="105" x="190" y="618" fill="#312e81" rx="22"/><text x="600" y="655" class="footer-title" text-anchor="middle">Every route uses the same production loop</text><text x="600" y="683" class="footer-copy" text-anchor="middle">Editable semantic source → render in the lesson environment → inspect visually and factually</text><text x="600" y="706" class="footer-copy" text-anchor="middle">→ revise locally → add accessibility, provenance, and a static fallback</text></svg>