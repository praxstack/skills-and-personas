<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="router-title router-desc">
  <title id="router-title">Choose a lesson visualization by its learning job</title>
  <desc id="router-desc">A decision map routes a learner's need to structure, quantity, interaction, change over time, or appearance. Every route ends in an editable source, rendered inspection, revision, accessibility, provenance, and a static fallback.</desc>
  <defs>
    <linearGradient id="header-gradient" x1="0" x2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 32px system-ui, sans-serif; fill: white; }
      .subtitle { font: 400 17px system-ui, sans-serif; fill: #dbeafe; }
      .question { font: 700 22px system-ui, sans-serif; fill: #0f172a; }
      .node-title { font: 700 18px system-ui, sans-serif; fill: #0f172a; }
      .node-copy { font: 400 14px system-ui, sans-serif; fill: #334155; }
      .tool { font: 600 13px system-ui, sans-serif; fill: #3730a3; }
      .footer-title { font: 700 18px system-ui, sans-serif; fill: white; }
      .footer-copy { font: 400 14px system-ui, sans-serif; fill: #e0e7ff; }
      .connector { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#f8fafc"/>
  <path d="M28 0 H1172 Q1200 0 1200 28 V132 H0 V28 Q0 0 28 0Z" fill="url(#header-gradient)"/>
  <text x="58" y="58" class="title">Choose the visual by the learning job</text>
  <text x="58" y="92" class="subtitle">Use the simplest medium that exposes the relationship accurately. Motion is a dimension, not decoration.</text>

  <rect x="395" y="162" width="410" height="78" rx="20" fill="white" stroke="#cbd5e1"/>
  <text x="600" y="197" text-anchor="middle" class="question">What must the learner perceive?</text>
  <text x="600" y="221" text-anchor="middle" class="node-copy">Structure, quantity, interaction, change, or appearance?</text>

  <path class="connector" d="M480 240 C360 270 260 270 160 315"/>
  <path class="connector" d="M540 240 C480 270 420 280 380 315"/>
  <path class="connector" d="M600 240 V315"/>
  <path class="connector" d="M660 240 C720 270 780 280 820 315"/>
  <path class="connector" d="M720 240 C840 270 940 270 1040 315"/>

  <g id="route-structure">
    <rect x="55" y="315" width="210" height="230" rx="20" fill="#eff6ff" stroke="#60a5fa"/>
    <circle cx="160" cy="357" r="25" fill="#dbeafe"/>
    <path d="M146 357h28M160 343v28" stroke="#1d4ed8" stroke-width="4" stroke-linecap="round"/>
    <text x="160" y="405" text-anchor="middle" class="node-title">Structure</text>
    <text x="160" y="433" text-anchor="middle" class="node-copy">Exact labels, flows,</text>
    <text x="160" y="453" text-anchor="middle" class="node-copy">hierarchy, geometry</text>
    <text x="160" y="492" text-anchor="middle" class="tool">SVG · Mermaid · D2</text>
    <text x="160" y="514" text-anchor="middle" class="tool">Graphviz · draw.io</text>
  </g>

  <g id="route-quantity">
    <rect x="275" y="315" width="210" height="230" rx="20" fill="#f0fdf4" stroke="#4ade80"/>
    <circle cx="380" cy="357" r="25" fill="#dcfce7"/>
    <path d="M365 370v-16M377 370v-30M389 370v-23M401 370v-39" stroke="#15803d" stroke-width="5" stroke-linecap="round"/>
    <text x="380" y="405" text-anchor="middle" class="node-title">Quantity</text>
    <text x="380" y="433" text-anchor="middle" class="node-copy">Comparison, trend,</text>
    <text x="380" y="453" text-anchor="middle" class="node-copy">distribution, uncertainty</text>
    <text x="380" y="492" text-anchor="middle" class="tool">Vega-Lite · Plot</text>
    <text x="380" y="514" text-anchor="middle" class="tool">ECharts · domain plots</text>
  </g>

  <g id="route-interaction">
    <rect x="495" y="315" width="210" height="230" rx="20" fill="#fff7ed" stroke="#fb923c"/>
    <circle cx="600" cy="357" r="25" fill="#ffedd5"/>
    <path d="M587 345h26v24h-26zM592 351h16M592 357h10" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round"/>
    <text x="600" y="405" text-anchor="middle" class="node-title">Interaction</text>
    <text x="600" y="433" text-anchor="middle" class="node-copy">Change, test, inspect,</text>
    <text x="600" y="453" text-anchor="middle" class="node-copy">filter, connect, predict</text>
    <text x="600" y="492" text-anchor="middle" class="tool">HTML/SVG/JS · React Flow</text>
    <text x="600" y="514" text-anchor="middle" class="tool">Canvas · WebGL</text>
  </g>

  <g id="route-change">
    <rect x="715" y="315" width="210" height="230" rx="20" fill="#faf5ff" stroke="#c084fc"/>
    <circle cx="820" cy="357" r="25" fill="#f3e8ff"/>
    <path d="M808 343l20 14-20 14z" fill="#7e22ce"/>
    <text x="820" y="405" text-anchor="middle" class="node-title">Change over time</text>
    <text x="820" y="433" text-anchor="middle" class="node-copy">Causality, transformation,</text>
    <text x="820" y="453" text-anchor="middle" class="node-copy">sequence, synchronization</text>
    <text x="820" y="492" text-anchor="middle" class="tool">Manim 0.21 · HyperFrames</text>
    <text x="820" y="514" text-anchor="middle" class="tool">interactive first · film projection</text>
  </g>

  <g id="route-appearance">
    <rect x="935" y="315" width="210" height="230" rx="20" fill="#fff1f2" stroke="#fb7185"/>
    <circle cx="1040" cy="357" r="25" fill="#ffe4e6"/>
    <path d="M1026 370l9-13 8 8 9-14 12 19z" fill="none" stroke="#be123c" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="1031" cy="348" r="4" fill="#be123c"/>
    <text x="1040" y="405" text-anchor="middle" class="node-title">Appearance</text>
    <text x="1040" y="433" text-anchor="middle" class="node-copy">Scene, object, atmosphere,</text>
    <text x="1040" y="453" text-anchor="middle" class="node-copy">visual metaphor</text>
    <text x="1040" y="492" text-anchor="middle" class="tool">Image generation</text>
    <text x="1040" y="514" text-anchor="middle" class="tool">Sourced photography</text>
  </g>

  <path class="connector" d="M160 545 C160 590 300 590 370 618"/>
  <path class="connector" d="M380 545 C380 580 450 588 500 618"/>
  <path class="connector" d="M600 545 V618"/>
  <path class="connector" d="M820 545 C820 580 750 588 700 618"/>
  <path class="connector" d="M1040 545 C1040 590 900 590 830 618"/>

  <rect x="190" y="618" width="820" height="105" rx="22" fill="#312e81"/>
  <text x="600" y="655" text-anchor="middle" class="footer-title">Every route uses the same production loop</text>
  <text x="600" y="683" text-anchor="middle" class="footer-copy">Editable semantic source → render in the lesson environment → inspect visually and factually</text>
  <text x="600" y="706" text-anchor="middle" class="footer-copy">→ revise locally → add accessibility, provenance, and a static fallback</text>
</svg>
